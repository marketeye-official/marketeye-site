[build]
  command = "rm -rf preview && npm run build"
  publish = "_site"

  # Skip the build when a push changed nothing outside preview/.
  #
  # `command` above removes preview/ from the build workspace, so preview LPs can
  # never reach production — but that happens INSIDE a build that has already
  # started. Deciding whether a build starts at all is what `ignore` does, and
  # without it Netlify builds every push to main. A preview-only publish was
  # therefore running a full Eleventy build and republishing byte-identical
  # output. Confirmed 2026-09-06 on the ret-macro-v6 preview push: 12s build,
  # deploy summary "All files already uploaded by a previous deploy."
  #
  # Semantics are inverted and easy to misread: exit 0 CANCELS the build, a
  # non-zero exit lets it proceed. `git diff --quiet` exits 0 when there is no
  # difference — so "nothing changed outside preview/" cancels, and any change to
  # assets/, a root LP, _includes/, this file or anything else builds as normal.
  #
  # It diffs against CACHED_COMMIT_REF — the last commit actually BUILT, not the
  # parent commit. A skipped build does not advance it, so a production change
  # following several skipped preview pushes still builds and still includes
  # everything in between. Nothing can be stranded.
  #
  # IT DOES NOT FAIL SAFE ON ITS OWN — this is guarded, and the guard is the
  # point. Fixed 2026-10-05 after it cancelled the homepage deploy (main@331e15e)
  # and, earlier, the homepage preview push.
  #
  # When the build cache is unavailable, Netlify leaves $CACHED_COMMIT_REF EMPTY
  # rather than erroring. The bare command then loses an argument and silently
  # becomes a different command:
  #
  #     git diff --quiet $COMMIT_REF -- . ':(exclude)preview'
  #
  # One commit argument means "diff the WORKING TREE against $COMMIT_REF." The
  # repo was just cloned at that very commit, so there is nothing to find: git
  # exits 0 and the build is cancelled — whatever was actually changed. The
  # deploy log shows it plainly: "Failed to fetch cache, continuing with build"
  # a few lines above "User-specified ignore command returned exit code 0."
  #
  # Cache misses are routine (first build after a quiet period, cache eviction,
  # infra change), so this is not a rare edge. Worse, "Clear cache and retry" —
  # the obvious thing to reach for when a deploy is stuck — GUARANTEES the empty
  # ref and so reproduces the cancellation instead of clearing it.
  #
  # The && chain below exits non-zero (= build) unless it can prove a skip is
  # right: the ref must be non-empty AND resolve to a commit present in this
  # clone before the diff is allowed to decide anything. Note the clone is
  # --filter=blob:none, so an old ref may legitimately be absent.
  #
  # ':(exclude)preview' is spelled ":!preview" here — same pathspec magic, and it
  # avoids nesting single quotes inside a TOML literal string.
  #
  # To disable, comment this line out.
  ignore = '''[ -n "$CACHED_COMMIT_REF" ] && git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":!preview"'''
# Current Community Agreement version. Bump `to` when a new version is
# archived. The versioned paths themselves are permanent and are never edited
# in place, because consent records point at them forever.
[[redirects]]
  from = "/community-terms"
  to = "/community-terms/2026-09-03.1/"
  status = 302

# The site Terms of Service moved from /terms-of-service/ to /terms/ once the
# permalink started applying (see eleventy.config.js). Six pages still link to
# the old path, and one of them is inside a consent statement.
[[redirects]]
  from = "/terms-of-service"
  to = "/terms/"
  status = 301

[[redirects]]
  from = "/terms-of-service/*"
  to = "/terms/"
  status = 301

# Retired LP versions folded into the live one. Ads and short links pointing at
# v3 and v5 keep working and land on v6.
#
# `force = true` is REQUIRED here and is the whole trick. ret-macro-v3.html and
# ret-macro-v5.html are still in the repo, so Eleventy still builds them to
# /ret-macro-v3/index.html and /ret-macro-v5/index.html. Netlify serves an
# existing file in preference to a redirect unless the rule is forced, so
# without `force` these rules would never fire. Deleting the two HTML files
# would work too — forcing keeps them recoverable by removing the rule.
#
# Query strings pass through automatically: Netlify appends the incoming query
# string to the destination whenever the destination has no query string of its
# own. `to` therefore must NOT carry any params — adding even one would replace
# the incoming ones and drop utm_*, fbclid and gclid.
#
# Three rules per version because Netlify matches the whole path: bare, splat
# (trailing slash and anything under it), and the .html form in case a
# preview-style URL was ever pasted against the production domain.
[[redirects]]
  from = "/ret-macro-v5"
  to = "/ret-macro-v6/"
  status = 301
  force = true

[[redirects]]
  from = "/ret-macro-v5/*"
  to = "/ret-macro-v6/"
  status = 301
  force = true

[[redirects]]
  from = "/ret-macro-v5.html"
  to = "/ret-macro-v6/"
  status = 301
  force = true

[[redirects]]
  from = "/ret-macro-v3"
  to = "/ret-macro-v6/"
  status = 301
  force = true

[[redirects]]
  from = "/ret-macro-v3/*"
  to = "/ret-macro-v6/"
  status = 301
  force = true

[[redirects]]
  from = "/ret-macro-v3.html"
  to = "/ret-macro-v6/"
  status = 301
  force = true